<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Aquaponia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <!-- Importa a biblioteca de gráficos Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #eef1f4; color: #333; padding: 20px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 800px; }
        
        /* Cabeçalho e Status */
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 6px; border: 1px solid #d1d5db; margin-bottom: 20px; }
        .header h2 { font-size: 1.2em; font-weight: 600; color: #1f2937; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
        .status-online { background: #def7ec; color: #03543f; border-color: #84e1bc; }
        
        /* Navegação por Abas */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; border-radius: 6px; font-weight: 600; color: #6b7280; transition: 0.2s; }
        .tab-btn:hover { background: #f3f4f6; }
        .tab-btn.active { background: #0056b3; color: white; border-color: #0056b3; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Grade de Variáveis (Tempo Real) */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #d1d5db; text-align: left; }
        .card .label { font-size: 0.85em; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
        .card .valor { font-size: 1.8em; font-weight: bold; color: #111827; }
        .card .unidade { font-size: 0.5em; font-weight: normal; color: #6b7280; }
        
        /* Grade de Gráficos (Histórico) */
        .chart-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .chart-card { background: #fff; padding: 15px; border-radius: 6px; border: 1px solid #d1d5db; width: 100%; height: 250px; }
        
        /* Responsividade para ecrãs pequenos (Telemóvel) */
        @media (max-width: 600px) {
            .grid, .chart-grid { grid-template-columns: 1fr; }
            .chart-card { height: 200px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h2>Monitoramento do Sistema de Aquaponia</h2>
            <span id="status" class="status-badge">Aguardando Conexão</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('tempo-real', this)">Tempo Real</button>
            <button class="tab-btn" onclick="mudarAba('historico', this)">Gráficos</button>
        </div>

        <!-- ABA 1: Valores em Tempo Real -->
        <div id="tempo-real" class="tab-content active">
            <div class="grid">
                <div class="card">
                    <span class="label">Temperatura</span>
                    <div class="valor"><span id="temp">--</span><span class="unidade"> °C</span></div>
                </div>
                <div class="card">
                    <span class="label">Potencial Hidrogeniônico</span>
                    <div class="valor"><span id="ph">--</span><span class="unidade"> pH</span></div>
                </div>
                <div class="card">
                    <span class="label">Sólidos Dissolvidos</span>
                    <div class="valor"><span id="tds">--</span><span class="unidade"> ppm</span></div>
                </div>
                <div class="card">
                    <span class="label">Fluxo de Água</span>
                    <div class="valor"><span id="fluxo">--</span><span class="unidade"> L/min</span></div>
                </div>
            </div>
        </div>

        <!-- ABA 2: Gráficos Históricos -->
        <div id="historico" class="tab-content">
            <div class="chart-grid">
                <div class="chart-card"><canvas id="graficoTemp"></canvas></div>
                <div class="chart-card"><canvas id="graficoPH"></canvas></div>
                <div class="chart-card"><canvas id="graficoTDS"></canvas></div>
                <div class="chart-card"><canvas id="graficoFluxo"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        function mudarAba(idAba, elementoBotao) {
            document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idAba).classList.add('active');
            elementoBotao.classList.add('active');
        }

        const maxPontos = 30; // Limita o histórico a 30 medições para fluidez
        const eixosX = []; // Guarda os horários
        
        // Função genérica para criar gráficos interpolados (tension: 0.4)
        function criarGrafico(idCanvas, rotulo, corLinha) {
            const ctx = document.getElementById(idCanvas).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: eixosX,
                    datasets: [{
                        label: rotulo,
                        data: [],
                        borderColor: corLinha,
                        borderWidth: 2,
                        tension: 0.4, // Cria a interpolação suave (curva)
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 400 },
                    scales: {
                        x: { display: true, ticks: { maxTicksLimit: 5 } },
                        y: { display: true }
                    },
                    plugins: { legend: { display: true } }
                }
            });
        }

        // Inicializa os 4 gráficos
        const chartTemp = criarGrafico('graficoTemp', 'Temperatura (°C)', '#ef4444');
        const chartPH = criarGrafico('graficoPH', 'pH', '#10b981');
        const chartTDS = criarGrafico('graficoTDS', 'TDS (ppm)', '#f59e0b');
        const chartFluxo = criarGrafico('graficoFluxo', 'Fluxo (L/min)', '#3b82f6');

        function atualizarGraficos(dados) {
            const agora = new Date();
            const horaFormatada = agora.getHours().toString().padStart(2, '0') + ':' + 
                                  agora.getMinutes().toString().padStart(2, '0') + ':' + 
                                  agora.getSeconds().toString().padStart(2, '0');

            eixosX.push(horaFormatada);
            chartTemp.data.datasets[0].data.push(dados.temperatura);
            chartPH.data.datasets[0].data.push(dados.pH);
            chartTDS.data.datasets[0].data.push(dados.tds);
            chartFluxo.data.datasets[0].data.push(dados.fluxo);

            // Remove o dado mais antigo se passar do limite de memória
            if (eixosX.length > maxPontos) {
                eixosX.shift();
                chartTemp.data.datasets[0].data.shift();
                chartPH.data.datasets[0].data.shift();
                chartTDS.data.datasets[0].data.shift();
                chartFluxo.data.datasets[0].data.shift();
            }

            chartTemp.update(); chartPH.update(); chartTDS.update(); chartFluxo.update();
        }

        //CREDENCIAIS HIVEMQ CLOUD
        const broker = "39953b53f9834349834631e69c8abcdc.s1.eu.hivemq.cloud"; 
        const porta = 8884; 
        const usuario = "site";
        const senha = "Tetris67";
        const topico = "aquaponia/sensores";
        const clientId = "web_" + Math.random().toString(16).substr(2, 8);
        const client = new Paho.MQTT.Client(broker, porta, "/mqtt", clientId);

        client.onConnectionLost = function(responseObject) {
            const statusEl = document.getElementById("status");
            statusEl.innerText = "Desconectado";
            statusEl.className = "status-badge";
        };

        client.onMessageArrived = function(message) {
            try {
                const dados = JSON.parse(message.payloadString);
                
                // Atualiza a Aba de Tempo Real
                document.getElementById("temp").innerText = dados.temperatura.toFixed(1);
                document.getElementById("ph").innerText = dados.pH.toFixed(1);
                document.getElementById("tds").innerText = dados.tds;
                document.getElementById("fluxo").innerText = dados.fluxo.toFixed(1);

                // Atualiza a Aba de Histórico (Gráficos)
                atualizarGraficos(dados);
            } catch (e) {
                console.error("Erro ao processar JSON", e);
            }
        };

        const options = {
            useSSL: true,
            userName: usuario,
            password: senha,
            onSuccess: function() {
                const statusEl = document.getElementById("status");
                statusEl.innerText = "Online";
                statusEl.className = "status-badge status-online";
                client.subscribe(topico);
            }
        };

        client.connect(options);
    </script>
</body>
</html>
